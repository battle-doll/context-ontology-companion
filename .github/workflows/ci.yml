name: portable-validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/build_plugin.py --check-directory
      - run: python scripts/check.py
      - run: python scripts/validate_design.py --require-schema --require-manifest
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s experiments/tests -v
      - run: python scripts/public_gate.py
