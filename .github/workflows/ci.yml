name: portable-validation
on:
  push:
    branches: ["main"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.ref == 'refs/heads/main' && 'default' || format('isolated-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      # Automatic checks cover the oldest/newest supported Python; tag and manual checks retain every platform.
      matrix: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '{"os":["macos-latest","windows-latest","ubuntu-latest"],"python":["3.11","3.12","3.13"]}' || '{"include":[{"os":"ubuntu-latest","python":"3.11"},{"os":"ubuntu-latest","python":"3.13"}]}') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/build_plugin.py --check-directory
      - run: python scripts/check.py
      - run: python scripts/validate_design.py --require-schema --require-manifest
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s experiments/tests -v
      - run: python scripts/public_gate.py
