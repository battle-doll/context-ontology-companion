name: Bug report
description: Report a reproducible problem using synthetic data only.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not disclose secrets, private conversations, proprietary code, or security vulnerabilities here. Read SECURITY.md for sensitive findings. This template does not establish an active public support channel."
  - type: input
    id: revision
    attributes:
      label: Product revision
      description: "Context Ontology Companion: exact version or commit."
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and architecture
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Exact command and synthetic reproduction
      description: Include working-directory context, exit code, and a minimal synthetic input. Remove personal paths.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Execution surface
      options:
        - Local CLI
        - CI job
        - Actual plugin host
        - Documentation only
